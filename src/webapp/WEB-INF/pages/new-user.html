<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление нового пользователя</title>
</head>
<body>
<h1>Создание нового пользователя</h1>

<form th:action="@{/users}" th:object="${user}" method="post">
    Имя: <input type="text" th:field ="*{name}"><br>
    Фамилия: <input type="text" th:field ="*{lastName}"><br>
    Возраст: <input type="number" th:field ="*{age}">
    <input type="submit" value="Сохранить!">
</form>
    <br>
<a th:href="@{/users}">Назад к списку</a>
</body>
</html>
